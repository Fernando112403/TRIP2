<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="ISO-8859-1">
<title>Trips</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
<img th:src="@{/images/logo.png}" width="136" height="136">
<h1>Trips en El Salvador</h1>

<table class="table table-hover">

<tr>
<td>id</td>
<td>nombre</td>
<td>Fecha publicacion</td>
<td>Costo</td>
<td>Descripcion</td>
<td>Destacado</td>
</tr>

<tr th:each="trip : ${trips}">
<td th:text="${trip.id}"></td>
<td th:text="${trip.nomTrip}"></td>
<td th:text="${trip.fecha}"></td>
<td th:text="${trip.costo}"></td>
<td th:text="${trip.descripcion}"></td>
<td th:text="${trip.destacado == 1? 'Si':'No'}"></td>
<td>
    <span th:if="${trip.destacado == 1}" class="badge bg-success">Si</span>
    <span th:unless="${trip.destacado == 1}" class="badge bg-danger">No</span>
</td>
</tr>

</table>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
